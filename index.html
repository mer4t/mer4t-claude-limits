<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Claude Limitleri</title>
<style>
  :root{
    --bg: #0e0e10;
    --panel: #17171a;
    --panel-border: #2a2a2e;
    --titlebar: #1d1d20;
    --text: #e8e6e3;
    --dim: #8a8a90;
    --dimmer: #55555c;
    --accent: #d97757;
    --accent-soft: #d9775733;
    --amber: #e2b93b;
    --red: #e05a4e;
    --green: #6fbf73;
    --track: #2b2b2f;
    --mono: ui-monospace, "Cascadia Code", "JetBrains Mono", Consolas, "SFMono-Regular", Menlo, monospace;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background: radial-gradient(1200px 800px at 20% -10%, #1a1512 0%, var(--bg) 55%);
    color: var(--text);
    font-family: var(--mono);
    -webkit-font-smoothing: antialiased;
  }
  body{
    display:flex; align-items:center; justify-content:center;
    min-height: 100vh;
    padding: 24px;
  }
  .window{
    width: 100%;
    max-width: 620px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 30px 80px -30px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.02);
  }
  .titlebar{
    background: var(--titlebar);
    border-bottom: 1px solid var(--panel-border);
    padding: 10px 14px;
    display:flex; align-items:center; gap:10px;
  }
  .dots{ display:flex; gap:6px; }
  .dot{ width:11px; height:11px; border-radius:50%; }
  .dot.r{ background:#ff5f57; } .dot.y{ background:#febc2e; } .dot.g{ background:#28c840; }
  .title{ flex:1; text-align:center; font-size:12.5px; color: var(--dim); margin-right:34px; }
  .badge{
    font-size: 11px; color: var(--dim); background: #0000; border: 1px solid var(--panel-border);
    padding: 2px 8px; border-radius: 999px; letter-spacing: .3px;
  }

  .body{ padding: 20px 22px 18px; }
  .brand{
    display:flex; align-items:center; gap:10px; margin-bottom: 4px;
  }
  .brand .mark{ color: var(--accent); font-size: 18px; }
  .brand .name{ font-size: 14.5px; font-weight: 600; letter-spacing:.2px; }
  .brand .plan{ margin-left:auto; font-size: 11.5px; color: var(--dim); }

  .status-row{
    display:flex; align-items:center; gap:8px; margin: 2px 0 18px;
    font-size: 11.5px; color: var(--dimmer);
  }
  .pulse{
    width:7px; height:7px; border-radius:50%; background: var(--green);
    box-shadow: 0 0 0 0 rgba(111,191,115,.6);
    animation: pulse 2s infinite;
  }
  .pulse.err{ background: var(--red); animation: pulseErr 1.4s infinite; }
  @keyframes pulse{
    0%{ box-shadow: 0 0 0 0 rgba(111,191,115,.55); }
    70%{ box-shadow: 0 0 0 6px rgba(111,191,115,0); }
    100%{ box-shadow: 0 0 0 0 rgba(111,191,115,0); }
  }
  @keyframes pulseErr{
    0%{ box-shadow: 0 0 0 0 rgba(224,90,78,.55); }
    70%{ box-shadow: 0 0 0 6px rgba(224,90,78,0); }
    100%{ box-shadow: 0 0 0 0 rgba(224,90,78,0); }
  }

  .card{
    background: #0000; border: 1px solid var(--panel-border);
    border-radius: 8px; padding: 14px 16px; margin-bottom: 12px;
  }
  .card-head{
    display:flex; align-items:baseline; justify-content:space-between; margin-bottom: 10px;
    gap: 10px;
  }
  .card-head .label{ font-size: 13px; color: var(--text); }
  .card-head .pct{ font-size: 13px; font-variant-numeric: tabular-nums; }
  .bar-wrap{ display:flex; align-items:center; gap:10px; }
  .bar{
    flex:1; height: 8px; border-radius: 999px; background: var(--track);
    overflow:hidden; position:relative;
  }
  .bar > i{
    display:block; height:100%; border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), #e79274);
    transition: width .5s ease;
  }
  .bar.amber > i{ background: linear-gradient(90deg, #c98f2a, var(--amber)); }
  .bar.red > i{ background: linear-gradient(90deg, #b9463b, var(--red)); }

  .meta-row{
    display:flex; justify-content:space-between; margin-top: 8px;
    font-size: 11.5px; color: var(--dim);
  }
  .meta-row .countdown{ color: var(--dimmer); }

  .footer{
    display:flex; align-items:center; justify-content:space-between;
    margin-top: 4px; font-size: 11px; color: var(--dimmer);
  }
  .footer button{
    font-family: var(--mono); font-size: 11px; color: var(--dim);
    background: #0000; border: 1px solid var(--panel-border); border-radius: 6px;
    padding: 4px 10px; cursor:pointer;
  }
  .footer button:hover{ color: var(--text); border-color:#3a3a40; }

  .error-box{
    border: 1px solid #5a2d27; background: #2a1512; color: #f0b3ab;
    border-radius: 8px; padding: 12px 14px; font-size: 12.5px; line-height:1.5;
    margin-bottom: 12px;
  }
  .empty{ color: var(--dim); font-size: 12.5px; padding: 6px 2px 14px; }
  .footer button:disabled{ opacity:.5; cursor:default; }
  [hidden]{ display:none !important; }
</style>
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
      <div class="title">claude — usage</div>
      <div class="badge" id="clock">--:--:--</div>
    </div>
    <div class="body">
      <div class="brand">
        <span class="mark">✳</span>
        <span class="name">Claude Code kullanım limitleri</span>
        <span class="plan" id="plan">—</span>
      </div>
      <div class="status-row">
        <span class="pulse" id="pulse"></span>
        <span id="statusText">bağlanıyor…</span>
      </div>

      <div class="error-box" id="errorBox" role="alert" hidden></div>
      <div id="cards"></div>
      <div class="empty" id="emptyMsg" hidden>Görüntülenecek limit verisi yok.</div>

      <div class="footer">
        <span id="lastUpdated">—</span>
        <button id="refreshBtn">şimdi yenile</button>
      </div>
    </div>
  </div>

<script>
const POLL_MS = 60000;
const PING_MS = 60000;
const TICK_MS = 1000;
const MAX_BACKOFF_MS = 5 * 60000;
// Limit sifirlandiktan sonra yeni degerin API'ye yansimasi icin kisa bir pay.
const RESET_SLACK_MS = 5000;

const LABELS = {
  session: 'Güncel oturum (5 saatlik)',
  weekly_all: 'Bu hafta (tüm modeller)',
  weekly_opus: 'Bu hafta (Opus)',
  weekly_sonnet: 'Bu hafta (Sonnet)',
  weekly_oauth_apps: 'Bu hafta (bağlı uygulamalar)',
};
const LEVEL_CLASS = { critical: 'red', warning: 'amber' };

// Sunucu ayni anda acik birden fazla pencereyi bu kimlikle ayirt eder; biri
// kapaninca digeri hala aciksa kapanmaz.
const PAGE_ID = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Math.random().toString(36).slice(2);
const pageQuery = 'page=' + encodeURIComponent(PAGE_ID);
const $ = (id) => document.getElementById(id);

function prettify(kind){
  if (LABELS[kind]) return LABELS[kind];
  return String(kind || '').replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

function validDate(iso){
  if (!iso) return null;
  const d = new Date(iso);
  return Number.isNaN(d.getTime()) ? null : d;
}

function fmtAbsolute(iso){
  const d = validDate(iso);
  if (!d) return null;
  const now = new Date();
  const time = d.toLocaleTimeString('tr-TR', { hour:'2-digit', minute:'2-digit' });
  if (d.toDateString() === now.toDateString()) return `bugün ${time}`;
  const tomorrow = new Date(now); tomorrow.setDate(now.getDate()+1);
  if (d.toDateString() === tomorrow.toDateString()) return `yarın ${time}`;
  const datePart = d.toLocaleDateString('tr-TR', { day:'2-digit', month:'short' });
  return `${datePart} ${time}`;
}

function fmtCountdown(iso){
  const d = validDate(iso);
  if (!d) return '—';
  const diff = d.getTime() - Date.now();
  if (diff <= 0) return 'yenileniyor…';
  const totalMin = Math.floor(diff/60000);
  if (totalMin === 0) return '<1dk sonra';
  const days = Math.floor(totalMin/1440);
  const hrs = Math.floor((totalMin%1440)/60);
  const min = totalMin%60;
  const parts = [];
  if (days>0) parts.push(days+'g');
  if (days>0 || hrs>0) parts.push(hrs+'s');
  parts.push(min+'dk');
  return parts.join(' ') + ' sonra';
}

function fmtAgo(secs){
  if (secs < 60) return secs + 'sn';
  const min = Math.floor(secs/60);
  if (min < 60) return min + 'dk';
  return Math.floor(min/60) + 'sa ' + (min%60) + 'dk';
}

function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

let latest = null; // { limits, fetchedAt, subscriptionType, rateLimitTier, error }

// Kartlar innerHTML yerine DOM ile kuruluyor: API'den gelen degerler HTML
// olarak yorumlanamaz ve CSP satir ici stile izin vermek zorunda kalmaz.
function render(){
  if (!latest){
    $('statusText').textContent = 'bağlanıyor…';
    return;
  }
  const limits = latest.limits || [];

  if (latest.error){
    $('pulse').classList.add('err');
    $('statusText').textContent = limits.length ? 'bağlantı hatası — son bilinen veriler gösteriliyor' : 'bağlantı hatası';
    $('errorBox').textContent = latest.error;
    $('errorBox').hidden = false;
  } else {
    $('pulse').classList.remove('err');
    $('statusText').textContent = 'canlı';
    $('errorBox').hidden = true;
  }

  if (latest.subscriptionType){
    $('plan').textContent = String(latest.subscriptionType).toUpperCase() + (latest.rateLimitTier ? ' · ' + latest.rateLimitTier : '');
  }

  $('emptyMsg').hidden = limits.length > 0;
  $('cards').replaceChildren(...limits.map((l) => {
    const pct = Math.max(0, Math.min(100, Number(l.percent) || 0));
    const label = prettify(l.kind);

    const head = el('div', 'card-head');
    head.append(el('span', 'label', label), el('span', 'pct', pct.toFixed(0) + '%'));

    const bar = el('div', 'bar ' + (LEVEL_CLASS[l.level] || ''));
    bar.setAttribute('role', 'progressbar');
    bar.setAttribute('aria-valuenow', String(Math.round(pct)));
    bar.setAttribute('aria-valuemin', '0');
    bar.setAttribute('aria-valuemax', '100');
    bar.setAttribute('aria-label', label);
    const fill = el('i');
    fill.style.width = pct + '%';
    bar.append(fill);
    const barWrap = el('div', 'bar-wrap');
    barWrap.append(bar);

    const abs = fmtAbsolute(l.resetsAt);
    const countdown = el('span', 'countdown', fmtCountdown(l.resetsAt));
    countdown.dataset.reset = l.resetsAt || '';
    const meta = el('div', 'meta-row');
    meta.append(el('span', null, abs ? 'yenilenme: ' + abs : 'süresiz'), countdown);

    const card = el('div', 'card');
    card.append(head, barWrap, meta);
    return card;
  }));
  tick();
}

function tick(){
  document.querySelectorAll('.countdown').forEach((c) => {
    if (c.dataset.reset) c.textContent = fmtCountdown(c.dataset.reset);
  });
  if (latest && latest.fetchedAt){
    const secs = Math.max(0, Math.round((Date.now() - new Date(latest.fetchedAt).getTime())/1000));
    $('lastUpdated').textContent = `son güncelleme: ${fmtAgo(secs)} önce`;
  }
  $('clock').textContent = new Date().toLocaleTimeString('tr-TR');
}

let backoffMs = POLL_MS;
let pollTimer = null;
let inFlight = false;
let lastAttempt = 0;

async function readJson(res){
  try { return await res.json(); } catch { return null; }
}

async function poll(force){
  // Ayni anda tek istek: yenile butonuna art arda basmak API'ye yuklenmesin.
  if (inFlight) return;
  inFlight = true;
  lastAttempt = Date.now();
  clearTimeout(pollTimer);
  $('refreshBtn').disabled = true;
  try {
    const res = await fetch('/api/usage?' + pageQuery + (force ? '&force=1' : ''), { cache: 'no-store' });
    const json = await readJson(res);
    if (res.ok && json && Array.isArray(json.limits)){
      latest = { limits: json.limits, fetchedAt: json.fetchedAt, subscriptionType: json.subscriptionType, rateLimitTier: json.rateLimitTier, error: null };
      backoffMs = POLL_MS;
    } else {
      const error = (json && json.error) || `Yerel sunucu beklenmeyen bir cevap verdi (HTTP ${res.status}).`;
      latest = { ...(latest || {}), error };
      backoffMs = Math.min(backoffMs * 2, MAX_BACKOFF_MS);
    }
  } catch (e) {
    latest = { ...(latest || {}), error: 'Yerel sunucuya ulaşılamadı: ' + e.message };
    backoffMs = Math.min(backoffMs * 2, MAX_BACKOFF_MS);
  } finally {
    inFlight = false;
    $('refreshBtn').disabled = false;
  }
  render();
  scheduleNext();
}

// Pencere gizliyken API sorgulanmaz (sunucuya sadece ping gider); gorunur
// olunca kalan sure kadar beklenir. Bir limit sifirlanacaksa o an yenilenir.
function scheduleNext(){
  clearTimeout(pollTimer);
  if (document.hidden) return;
  const now = Date.now();
  let delay = backoffMs - (now - lastAttempt);
  if (latest && !latest.error){
    for (const l of latest.limits || []){
      const d = validDate(l.resetsAt);
      if (d && d.getTime() > now) delay = Math.min(delay, d.getTime() - now + RESET_SLACK_MS);
    }
  }
  pollTimer = setTimeout(() => poll(false), Math.max(0, delay));
}

// Paket uygulamada sunucu, hicbir sayfa ping atmazsa kendini kapatir.
function ping(){
  fetch('/api/ping?' + pageQuery, { cache: 'no-store' }).catch(() => {});
}

$('refreshBtn').addEventListener('click', () => {
  backoffMs = POLL_MS;
  poll(true);
});

document.addEventListener('visibilitychange', scheduleNext);

// Pencere kapaninca sunucuya haber ver (macOS'ta Chrome son pencere
// kapaninca kapanmadigi, varsayilan tarayicida ise pencereyi hic
// izleyemedigimiz icin sunucu bu sinyalle kendini sonlandirir).
window.addEventListener('pagehide', () => {
  try { navigator.sendBeacon('/api/bye?' + pageQuery); } catch {}
});

poll(false);
setInterval(tick, TICK_MS);
setInterval(ping, PING_MS);
</script>
</body>
</html>
