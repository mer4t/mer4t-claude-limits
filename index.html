<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Claude Limitleri</title>
<style>
  :root{
    --bg: #0e0e10;
    --panel: #17171a;
    --panel-border: #2a2a2e;
    --titlebar: #1d1d20;
    --text: #e8e6e3;
    --dim: #8a8a90;
    --dimmer: #55555c;
    --accent: #d97757;
    --accent-soft: #d9775733;
    --amber: #e2b93b;
    --red: #e05a4e;
    --green: #6fbf73;
    --track: #2b2b2f;
    --mono: ui-monospace, "Cascadia Code", "JetBrains Mono", Consolas, "SFMono-Regular", Menlo, monospace;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background: radial-gradient(1200px 800px at 20% -10%, #1a1512 0%, var(--bg) 55%);
    color: var(--text);
    font-family: var(--mono);
    -webkit-font-smoothing: antialiased;
  }
  body{
    display:flex; align-items:center; justify-content:center;
    min-height: 100vh;
    padding: 24px;
  }
  .window{
    width: 100%;
    max-width: 620px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 30px 80px -30px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.02);
  }
  .titlebar{
    background: var(--titlebar);
    border-bottom: 1px solid var(--panel-border);
    padding: 10px 14px;
    display:flex; align-items:center; gap:10px;
  }
  .dots{ display:flex; gap:6px; }
  .dot{ width:11px; height:11px; border-radius:50%; }
  .dot.r{ background:#ff5f57; } .dot.y{ background:#febc2e; } .dot.g{ background:#28c840; }
  .title{ flex:1; text-align:center; font-size:12.5px; color: var(--dim); margin-right:34px; }
  .badge{
    font-size: 11px; color: var(--dim); background: #0000; border: 1px solid var(--panel-border);
    padding: 2px 8px; border-radius: 999px; letter-spacing: .3px;
  }

  .body{ padding: 20px 22px 18px; }
  .brand{
    display:flex; align-items:center; gap:10px; margin-bottom: 4px;
  }
  .brand .mark{ color: var(--accent); font-size: 18px; }
  .brand .name{ font-size: 14.5px; font-weight: 600; letter-spacing:.2px; }
  .brand .plan{ margin-left:auto; font-size: 11.5px; color: var(--dim); }

  .status-row{
    display:flex; align-items:center; gap:8px; margin: 2px 0 18px;
    font-size: 11.5px; color: var(--dimmer);
  }
  .pulse{
    width:7px; height:7px; border-radius:50%; background: var(--green);
    box-shadow: 0 0 0 0 rgba(111,191,115,.6);
    animation: pulse 2s infinite;
  }
  .pulse.err{ background: var(--red); animation: pulseErr 1.4s infinite; }
  @keyframes pulse{
    0%{ box-shadow: 0 0 0 0 rgba(111,191,115,.55); }
    70%{ box-shadow: 0 0 0 6px rgba(111,191,115,0); }
    100%{ box-shadow: 0 0 0 0 rgba(111,191,115,0); }
  }
  @keyframes pulseErr{
    0%{ box-shadow: 0 0 0 0 rgba(224,90,78,.55); }
    70%{ box-shadow: 0 0 0 6px rgba(224,90,78,0); }
    100%{ box-shadow: 0 0 0 0 rgba(224,90,78,0); }
  }

  .card{
    background: #0000; border: 1px solid var(--panel-border);
    border-radius: 8px; padding: 14px 16px; margin-bottom: 12px;
  }
  .card-head{
    display:flex; align-items:baseline; justify-content:space-between; margin-bottom: 10px;
    gap: 10px;
  }
  .card-head .label{ font-size: 13px; color: var(--text); }
  .card-head .pct{ font-size: 13px; font-variant-numeric: tabular-nums; }
  .bar-wrap{ display:flex; align-items:center; gap:10px; }
  .bar{
    flex:1; height: 8px; border-radius: 999px; background: var(--track);
    overflow:hidden; position:relative;
  }
  .bar > i{
    display:block; height:100%; border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), #e79274);
    transition: width .5s ease;
  }
  .bar.amber > i{ background: linear-gradient(90deg, #c98f2a, var(--amber)); }
  .bar.red > i{ background: linear-gradient(90deg, #b9463b, var(--red)); }

  .meta-row{
    display:flex; justify-content:space-between; margin-top: 8px;
    font-size: 11.5px; color: var(--dim);
  }
  .meta-row .countdown{ color: var(--dimmer); }

  .footer{
    display:flex; align-items:center; justify-content:space-between;
    margin-top: 4px; font-size: 11px; color: var(--dimmer);
  }
  .footer button{
    font-family: var(--mono); font-size: 11px; color: var(--dim);
    background: #0000; border: 1px solid var(--panel-border); border-radius: 6px;
    padding: 4px 10px; cursor:pointer;
  }
  .footer button:hover{ color: var(--text); border-color:#3a3a40; }

  .error-box{
    border: 1px solid #5a2d27; background: #2a1512; color: #f0b3ab;
    border-radius: 8px; padding: 12px 14px; font-size: 12.5px; line-height:1.5;
    margin-bottom: 12px; display:none;
  }
  .empty{ color: var(--dim); font-size: 12.5px; padding: 6px 2px 14px; }
</style>
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
      <div class="title">claude — usage</div>
      <div class="badge" id="clock">--:--:--</div>
    </div>
    <div class="body">
      <div class="brand">
        <span class="mark">✳</span>
        <span class="name">Claude Code kullanım limitleri</span>
        <span class="plan" id="plan">—</span>
      </div>
      <div class="status-row">
        <span class="pulse" id="pulse"></span>
        <span id="statusText">bağlanıyor…</span>
      </div>

      <div class="error-box" id="errorBox"></div>
      <div id="cards"></div>
      <div class="empty" id="emptyMsg" style="display:none">Görüntülenecek limit verisi yok.</div>

      <div class="footer">
        <span id="lastUpdated">—</span>
        <button id="refreshBtn">şimdi yenile</button>
      </div>
    </div>
  </div>

<script>
const POLL_MS = 20000;
const TICK_MS = 1000;

const LABELS = {
  session: 'Güncel oturum (5 saatlik)',
  weekly_all: 'Bu hafta (tüm modeller)',
  weekly_opus: 'Bu hafta (Opus)',
  weekly_sonnet: 'Bu hafta (Sonnet)',
  weekly_oauth_apps: 'Bu hafta (bağlı uygulamalar)',
};

function prettify(kind){
  if (LABELS[kind]) return LABELS[kind];
  return kind.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

function fmtAbsolute(iso){
  if(!iso) return null;
  const d = new Date(iso);
  const now = new Date();
  const time = d.toLocaleTimeString('tr-TR', { hour:'2-digit', minute:'2-digit' });
  const sameDay = d.toDateString() === now.toDateString();
  if (sameDay) return `bugün ${time}`;
  const tomorrow = new Date(now); tomorrow.setDate(now.getDate()+1);
  if (d.toDateString() === tomorrow.toDateString()) return `yarın ${time}`;
  const datePart = d.toLocaleDateString('tr-TR', { day:'2-digit', month:'short' });
  return `${datePart} ${time}`;
}

function fmtCountdown(iso){
  if(!iso) return '—';
  const diff = new Date(iso).getTime() - Date.now();
  if (diff <= 0) return 'yenileniyor…';
  const totalMin = Math.floor(diff/60000);
  const days = Math.floor(totalMin/1440);
  const hrs = Math.floor((totalMin%1440)/60);
  const min = totalMin%60;
  const parts = [];
  if (days>0) parts.push(days+'g');
  if (days>0 || hrs>0) parts.push(hrs+'s');
  parts.push(min+'dk');
  return parts.join(' ') + ' sonra';
}

function severityClass(pct, severity){
  if (severity === 'critical' || pct >= 90) return 'red';
  if (severity === 'warning' || pct >= 70) return 'amber';
  return '';
}

function normalize(data){
  if (Array.isArray(data.limits) && data.limits.length){
    return data.limits.map(l => ({
      kind: l.kind,
      percent: Number(l.percent) || 0,
      resetsAt: l.resets_at,
      severity: l.severity,
    }));
  }
  const out = [];
  const map = [
    ['session', data.five_hour],
    ['weekly_all', data.seven_day],
    ['weekly_opus', data.seven_day_opus],
    ['weekly_sonnet', data.seven_day_sonnet],
    ['weekly_oauth_apps', data.seven_day_oauth_apps],
  ];
  for (const [kind, obj] of map){
    if (obj && typeof obj.utilization === 'number'){
      out.push({ kind, percent: obj.utilization, resetsAt: obj.resets_at, severity: null });
    }
  }
  return out;
}

let latest = null; // { limits, fetchedAt, error }

function render(){
  const cardsEl = document.getElementById('cards');
  const emptyEl = document.getElementById('emptyMsg');
  const errorBox = document.getElementById('errorBox');
  const pulse = document.getElementById('pulse');
  const statusText = document.getElementById('statusText');
  const planEl = document.getElementById('plan');
  const lastUpdatedEl = document.getElementById('lastUpdated');

  if (!latest){
    statusText.textContent = 'bağlanıyor…';
    return;
  }

  if (latest.error){
    pulse.classList.add('err');
    statusText.textContent = 'bağlantı hatası — son bilinen veriler gösteriliyor';
    errorBox.style.display = 'block';
    errorBox.textContent = latest.error;
  } else {
    pulse.classList.remove('err');
    statusText.textContent = 'canlı';
    errorBox.style.display = 'none';
  }

  if (latest.subscriptionType){
    planEl.textContent = latest.subscriptionType.toUpperCase() + (latest.rateLimitTier ? ' · ' + latest.rateLimitTier : '');
  }

  const limits = latest.limits || [];
  if (!limits.length){
    cardsEl.innerHTML = '';
    emptyEl.style.display = 'block';
  } else {
    emptyEl.style.display = 'none';
    cardsEl.innerHTML = limits.map((l, i) => {
      const pct = Math.max(0, Math.min(100, l.percent));
      const cls = severityClass(pct, l.severity);
      const abs = fmtAbsolute(l.resetsAt);
      return `
        <div class="card">
          <div class="card-head">
            <span class="label">${prettify(l.kind)}</span>
            <span class="pct">${pct.toFixed(0)}%</span>
          </div>
          <div class="bar-wrap">
            <div class="bar ${cls}"><i style="width:${pct}%"></i></div>
          </div>
          <div class="meta-row">
            <span>${abs ? 'yenilenme: ' + abs : 'süresiz'}</span>
            <span class="countdown" data-reset="${l.resetsAt || ''}">${fmtCountdown(l.resetsAt)}</span>
          </div>
        </div>`;
    }).join('');
  }

  if (latest.fetchedAt){
    const secs = Math.max(0, Math.round((Date.now() - new Date(latest.fetchedAt).getTime())/1000));
    lastUpdatedEl.textContent = `son güncelleme: ${secs}sn önce`;
  }
}

function tickCountdowns(){
  document.querySelectorAll('.countdown').forEach(el => {
    const iso = el.getAttribute('data-reset');
    if (iso) el.textContent = fmtCountdown(iso);
  });
  const lastUpdatedEl = document.getElementById('lastUpdated');
  if (latest && latest.fetchedAt){
    const secs = Math.max(0, Math.round((Date.now() - new Date(latest.fetchedAt).getTime())/1000));
    lastUpdatedEl.textContent = `son güncelleme: ${secs}sn önce`;
  }
  const now = new Date();
  document.getElementById('clock').textContent = now.toLocaleTimeString('tr-TR');
}

const MAX_BACKOFF_MS = 5 * 60000;
let backoffMs = POLL_MS;
let pollTimer = null;

async function poll(){
  try {
    const res = await fetch('/api/usage', { cache: 'no-store' });
    const json = await res.json();
    if (!res.ok){
      latest = { ...(latest || {}), error: json.error || ('HTTP ' + res.status) };
      backoffMs = Math.min(backoffMs * 2, MAX_BACKOFF_MS);
    } else {
      latest = { limits: normalize(json), fetchedAt: json.fetchedAt, subscriptionType: json.subscriptionType, rateLimitTier: json.rateLimitTier, error: null };
      backoffMs = POLL_MS;
    }
  } catch (e) {
    latest = { ...(latest || {}), error: 'Yerel sunucuya ulaşılamadı: ' + e.message };
    backoffMs = Math.min(backoffMs * 2, MAX_BACKOFF_MS);
  }
  render();
  clearTimeout(pollTimer);
  pollTimer = setTimeout(poll, backoffMs);
}

document.getElementById('refreshBtn').addEventListener('click', () => {
  backoffMs = POLL_MS;
  poll();
});

poll();
setInterval(tickCountdowns, TICK_MS);
</script>
</body>
</html>
